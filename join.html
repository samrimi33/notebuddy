<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a NoteBuddy list</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #FFF6F8; --text: #2B1B24; --muted: #8C7280; --card: #FFFFFF; --accent: #6C5CE7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1418; --text: #F8EAF0; --muted: #B39AA6; --card: #251C22; --accent: #9D8CFF; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 56px 16px; text-align: center; }
  .emoji { font-size: 64px; } h1 { font-size: 26px; margin: 8px 0; } .muted { color: var(--muted); }
  a.btn { display: block; margin: 24px 0 12px; padding: 16px; border-radius: 16px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
  a.link { color: var(--accent); }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-top: 24px; font-size: 14px; text-align: left; }
</style>
</head>
<body>
<main>
  <div class="emoji">🛒</div>
  <h1>You’re invited to a shared list</h1>
  <p class="muted" id="msg">Open it in NoteBuddy to see the list and add to it.</p>
  <a class="btn" id="open" href="#">Open in NoteBuddy</a>
  <p><a class="link" href="https://github.com/samrimi33/notebuddy/releases/latest">Don’t have NoteBuddy? Get it here</a></p>
  <div class="card">🔒 The list is end-to-end encrypted. Its key is in this link after the “#”, which your browser never sends to any server — not even this page’s.</div>
</main>
<script>
  // Everything after "#" stays in the browser; we only pass it on to the app on this phone.
  var p = new URLSearchParams(location.hash.slice(1));
  var l = p.get('l'), k = p.get('k');
  var a = document.getElementById('open');
  if (l && k && /^[0-9a-f-]{36}$/i.test(l) && /^[A-Za-z0-9_-]{40,50}$/.test(k)) {
    a.href = 'notebuddy://join?l=' + encodeURIComponent(l) + '&k=' + encodeURIComponent(k);
    setTimeout(function () { location.href = a.href; }, 300);
  } else {
    document.getElementById('msg').textContent = 'This invite link looks incomplete. Ask for a new one.';
    a.style.display = 'none';
  }
</script>
</body>
</html>
